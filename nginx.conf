server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;

    # Redirect bare root to the app
    location = / {
        return 301 /html/;
    }

    # Serve files; also try appending .html for extensionless URLs
    # e.g. /html/ice-hockey → html/ice-hockey.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
