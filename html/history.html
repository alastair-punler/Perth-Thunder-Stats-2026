<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" type="image/svg+xml" href="/resources/favicon.svg" />
        <title>Perth Thunder — Season History</title>

        <link href="https://fonts.googleapis.com/css?family=Open+Sans:400,300,600" rel="stylesheet" type="text/css" />

        <!-- Supabase -->
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
        <!-- App config -->
        <script src="/js/config.js"></script>

        <!-- D3.js -->
        <script
            src="https://cdnjs.cloudflare.com/ajax/libs/d3/6.6.0/d3.min.js"
            integrity="sha512-XgjkLS0sSzUq88GniFcrLy6zjgVWkBoRFziaLm1Z+gVgkHuO3ieikhD/Q6eNKXAsp88yvBFS0n6ovVlabXftIg=="
            crossorigin="anonymous"
        ></script>

        <!-- Bootstrap -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6"
            crossorigin="anonymous"
        />
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-JEW9xMcG8R+pH31jmWH6WWP0WintQrMb4s7ZOdauHnUtxwoG2vI5DkLtS3qm9Ekf"
            crossorigin="anonymous"
        ></script>

        <link rel="stylesheet" href="/index.css" />
        <style>
            .history-section { margin: 1.5rem 0; }
            .history-section h4 { font-weight: 600; margin-bottom: 0.75rem; }
            .game-row { cursor: pointer; }
            .game-row:hover td, .game-row:hover th { background-color: #f0f4ff; }
            .game-row.selected-game td, .game-row.selected-game th { background-color: #dce7ff; }
            .history-chart { width: 100%; max-width: 480px; }
            .charts-row { display: flex; gap: 2rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
            .game-detail-header { margin: 1.5rem 0 0.5rem; font-size: 1.1rem; font-weight: 600; color: #333; }
            .no-games-msg { color: #888; font-style: italic; margin: 2rem 0; }
            .history-back { display: inline-block; margin-bottom: 1rem; }
        </style>
    </head>
    <body>
        <div class="center header">
            <h1>Perth Thunder — Season History</h1>
        </div>
        <div class="container-fluid" style="max-width: 1100px; padding: 1rem;">
            <a class="history-back btn btn-outline-secondary btn-sm" href="index.html">← Back to Tracking</a>

            <div class="history-section" id="games-section">
                <h4>Games</h4>
                <div id="games-table-container">
                    <p class="no-games-msg">Loading games…</p>
                </div>
            </div>

            <div class="history-section" id="trends-section" style="display:none">
                <h4>Season Trends</h4>
                <div class="charts-row">
                    <div>
                        <div style="font-size:0.85rem;font-weight:600;margin-bottom:0.3rem">Shots per Game</div>
                        <svg class="history-chart" id="shots-chart" height="180"></svg>
                    </div>
                    <div>
                        <div style="font-size:0.85rem;font-weight:600;margin-bottom:0.3rem">Faceoff % over Games</div>
                        <svg class="history-chart" id="fo-chart" height="180"></svg>
                    </div>
                </div>
            </div>

            <div class="history-section" id="game-detail-section" style="display:none">
                <div class="game-detail-header" id="game-detail-title"></div>
                <div id="game-summary-container"></div>
            </div>
        </div>

        <script type="module" src="/js/history.js"></script>
    </body>
</html>
